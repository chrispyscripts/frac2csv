<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="theme.js"></script>
<title>FracView — Well charts</title>
<link rel="stylesheet" href="wellview.css">
<script src="session.js"></script>
<script src="quake-filter.js"></script>
<script src="account.js"></script>
</head>
<body>
<div class="wc">
  <header class="wc-head">
    <div>
      <div class="wc-title" id="wc-name">Loading…</div>
      <div class="wc-sub" id="wc-ident"></div>
    </div>
    <div class="wc-tools">
      <button id="wc-back" type="button">← Back</button>
      <button id="wc-add" type="button">Add to compare</button>
      <button id="wc-compare" type="button">Compare ↗</button>
      <button type="button" data-menu title="Main menu: home, sessions, groups, Discover, settings">☰ Menu</button>
      <button type="button" data-sessions title="Save every open FracView window and your settings as a session, or open one">Sessions</button>
      <button id="wc-section" type="button" title="The whole well in 2D, in its own window beside these charts">Section ↗</button>
      <span data-theme-toggle></span>
      <span data-account></span>
    </div>
  </header>

  <div class="wc-bar">
    <div class="wc-tabs" role="tablist" aria-label="Chart view">
      <button role="tab" id="tab-chart" aria-controls="pane-chart" aria-selected="true">Stage chart</button>
      <button role="tab" id="tab-stacked" aria-controls="pane-stacked" aria-selected="false" tabindex="-1">Stacked</button>
      <button role="tab" id="tab-frac" aria-controls="pane-frac" aria-selected="false" tabindex="-1">Sequential</button>
    </div>
    <div class="wc-stagenav">
      <button id="wc-prev" type="button" aria-label="Previous stage">‹</button>
      <div class="wc-steps" id="wc-steps" role="group" aria-label="Stages for this well"></div>
      <button id="wc-next" type="button" aria-label="Next stage">›</button>
    </div>
  </div>

  <main class="wc-main">
    <section class="wc-pane" id="pane-chart" role="tabpanel" aria-labelledby="tab-chart">
      <div class="wc-chartbar">
        <div class="wc-stageinfo" id="wc-stageinfo"></div>
        <div class="wc-legend" id="wc-legend" role="group" aria-label="Curves: click to hide, double-click to isolate"></div>
        <button id="wc-zoomreset" type="button" hidden>Reset zoom</button>
      </div>
      <div class="wc-plot">
        <canvas id="wc-canvas" tabindex="0" aria-label="Treatment curves for the selected stage. Scroll to zoom, drag to pan, double-click to reset."></canvas>
        <div class="wc-empty" id="wc-empty" hidden></div>
      </div>
      <div class="wc-hint">Scroll to zoom · Drag to pan · Double-click to reset · Click a curve name to hide it, double-click to isolate it · ← → change stage</div>
    </section>
    <section class="wc-pane" id="pane-stacked" role="tabpanel" aria-labelledby="tab-stacked" hidden></section>
    <section class="wc-pane" id="pane-frac" role="tabpanel" aria-labelledby="tab-frac" hidden></section>
  </main>

  <footer class="wc-foot" id="wc-foot"></footer>
</div>
<script src="wellview.js"></script>
<script src="gamma-palettes.js"></script>
<script src="menu.js"></script>
</body>
</html>
