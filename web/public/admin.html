<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Stratum — Invites &amp; accounts</title>
<style>
  :root{--panel:#0d1924;--line:#29404c;--ink:#e7f4fa;--mut:#93adb9;--faint:#6b8290;--accent:#5ee2d0;--warn:#ffb48a;--mono:ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 60% 20%,#122b36,#080f18 75%) fixed #080f18;color:var(--ink);
    font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  main{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  h1{margin:0;font-size:22px;letter-spacing:-.4px}
  h2{font-size:15px;margin:0 0 10px}
  .tools{display:flex;gap:8px;align-items:center}
  a.btn,button{background:#152936;border:1px solid #345260;border-radius:8px;color:var(--ink);padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
  a.btn:hover,button:hover{border-color:var(--accent)}
  button.go{background:#246358;border-color:#64e8ce;color:#f2fffc;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  form.new{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  label{display:grid;gap:4px;font-size:12px;color:var(--mut)}
  input,select{background:#0a141d;border:1px solid #345260;border-radius:8px;color:var(--ink);padding:7px 9px;font:inherit;font-size:13.5px}
  input[name=note]{width:260px;max-width:100%}
  input[type=number]{width:74px}
  .made{margin-top:12px;padding:12px;border:1px solid #64e8ce;border-radius:10px;background:#0f2a2c;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .made code{font:600 18px var(--mono);letter-spacing:.06em}
  .made .m{color:var(--mut);font-size:12.5px;flex-basis:100%}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px;border-bottom:1px solid #1c2f3b;vertical-align:top}
  td.code{font-family:var(--mono);white-space:nowrap}
  td .m{color:var(--mut);font-size:12px}
  .st{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid #345260;color:var(--mut)}
  .st.open{border-color:#64e8ce;color:#a8f5e8}
  .acts{display:flex;gap:6px;justify-content:flex-end}
  .msg{min-height:1.3em;color:var(--warn);font-size:13px;margin-top:8px}
  .msg.ok{color:var(--accent)}
  .empty{color:var(--mut);padding:8px 0}
  [hidden]{display:none!important}
</style>
<script src="account.js"></script>
</head>
<body>
<main>
  <header>
    <h1>Invites &amp; accounts</h1>
    <div class="tools"><a class="btn" href="map.html">← Map</a><span data-account></span></div>
  </header>

  <p id="denied" class="empty" hidden>Only an admin can manage invites and accounts.</p>

  <div id="admin" hidden>
    <section>
      <h2>New invite</h2>
      <form class="new" id="new" novalidate>
        <label>Who it’s for <input name="note" maxlength="120" placeholder="e.g. Sean, Montney review"></label>
        <label>Role <select name="role"><option value="user">User</option><option value="admin">Admin</option></select></label>
        <label>Uses <input name="uses" type="number" min="1" max="50" value="1"></label>
        <label>Valid for (days) <input name="days" type="number" min="1" max="90" value="14"></label>
        <button type="submit" class="go">Create invite code</button>
      </form>
      <div class="made" id="made" hidden>
        <code id="made-code"></code>
        <button type="button" id="copy-code">Copy code</button>
        <button type="button" id="copy-link">Copy invite link</button>
        <span class="m" id="made-note"></span>
      </div>
      <p class="msg" id="msg" role="status"></p>
    </section>

    <section>
      <h2>Codes</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Code</th><th>For</th><th>Kind</th><th>Uses</th><th>Status</th><th>Made</th><th>Expires</th><th></th></tr></thead>
        <tbody id="invites"></tbody>
      </table></div>
    </section>

    <section>
      <h2>Accounts</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Last sign-in</th><th>Code used</th><th></th></tr></thead>
        <tbody id="users"></tbody>
      </table></div>
    </section>
  </div>
</main>
<script src="admin.js"></script>
</body>
</html>
