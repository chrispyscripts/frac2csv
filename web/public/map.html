<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frac2CSV — WCSB Well Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg:#0f1621; --panel:#18222f; --ink:#e6edf3; --mut:#8496a8; --line:#26333f;
          --acc:#3d7dff; --good:#3fb950; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
               font:14px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif; }
  #map { position:absolute; inset:0; }
  .overlay { position:absolute; z-index:2; }
  .top { top:12px; left:12px; display:flex; gap:10px; align-items:flex-start; pointer-events:none; }
  .card { background:rgba(24,34,47,.94); border:1px solid var(--line); border-radius:8px;
          padding:12px 14px; pointer-events:auto; backdrop-filter:blur(6px); max-width:270px; }
  .title { font-size:15px; font-weight:600; }
  .title a { color:var(--acc); text-decoration:none; }
  .sub { color:var(--mut); font-size:12px; margin-top:2px; }
  .controls { display:flex; flex-direction:column; gap:7px; margin-top:10px; }
  .controls label { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--mut); cursor:pointer; }
  .controls input[type=range] { width:100%; }
  .prov { display:flex; flex-direction:column; gap:5px; margin-top:9px; padding-top:9px; border-top:1px solid var(--line); }
  .prov .phead { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); }
  .stat { font-family:var(--mono); font-size:11.5px; color:var(--mut); }
  .stat b { color:var(--ink); }
  .legend { margin-top:8px; display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--mut); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  .ln  { display:inline-block; width:16px; height:0; border-top:2px solid; margin-right:5px; vertical-align:3px; }
  .maplibregl-popup-content { background:var(--panel); color:var(--ink); border:1px solid var(--line);
        border-radius:8px; padding:12px 14px; font:13px/1.5 -apple-system,system-ui,sans-serif; max-width:280px; }
  .maplibregl-popup-tip { border-top-color:var(--panel) !important; border-bottom-color:var(--panel) !important; }
  .maplibregl-popup-close-button { color:var(--mut); font-size:17px; }
  .pop h3 { margin:0 0 6px; font-size:14px; }
  .pop .row { font-family:var(--mono); font-size:12px; color:var(--mut); }
  .pop .row b { color:var(--ink); }
  .pop .uwi { font-family:var(--mono); font-size:11.5px; color:var(--acc); word-break:break-all; margin-top:4px; }
  .pop a.btn { display:inline-block; margin-top:9px; background:var(--acc); color:#fff; text-decoration:none;
        font-size:12px; font-weight:600; padding:5px 11px; border-radius:5px; }
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
        z-index:5; background:var(--bg); font-family:var(--mono); color:var(--mut); }
  .spin { width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--acc);
        border-radius:50%; animation:sp .8s linear infinite; margin-right:8px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .searchbox { margin-top:9px; }
  .searchbox input { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:5px;
        color:var(--ink); font:inherit; font-size:12.5px; padding:5px 8px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="loading" id="loading"><span class="spin"></span>loading well data…</div>
<div class="overlay top">
  <div class="card">
    <div class="title"><a href="/">Frac2CSV</a> · WCSB Well Map</div>
    <div class="sub">Licensed wells · click one for UWI &amp; depth</div>
    <div class="searchbox"><input id="search" placeholder="Find by UWI or name…" autocomplete="off"></div>
    <div class="controls">
      <label><input type="checkbox" id="horiz-only"> Horizontals only (has a lateral)</label>
      <label>Min total depth: <span class="stat" id="td-val">0 m</span></label>
      <input type="range" id="td-min" min="0" max="5000" step="100" value="0">
    </div>
    <div class="prov" id="prov"><div class="phead">Provinces</div></div>
    <div class="stat" id="count" style="margin-top:8px">—</div>
    <div class="legend">
      <span><span class="dot" style="background:#3fb950"></span>vertical / surface point</span>
      <span><span class="dot" style="background:#3d7dff"></span>horizontal (drawn to bottomhole)</span>
      <span><span class="ln" style="border-color:#3d7dff"></span>wellbore lateral</span>
    </div>
    <div class="sub" style="margin-top:8px" id="sources">Source: provincial energy regulators (open data)</div>
  </div>
</div>
<script>
"use strict";
// Add a province here and drop its /data/<code>-wells.json in place; the map
// loads whatever exists and skips the rest.
const PROVINCES = [
  { code: "bc", name: "British Columbia", file: "/data/bc-wells.json" },
  { code: "ab", name: "Alberta",         file: "/data/ab-wells.json" },
];

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: { carto: {
      type: "raster",
      tiles: ["https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png",
              "https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png"],
      tileSize: 256,
      attribution: "© OpenStreetMap © CARTO · Wells: provincial energy regulators"
    } },
    layers: [{ id: "bg", type: "raster", source: "carto" }]
  },
  center: [-118, 55.5], zoom: 5
});
map.addControl(new maplibregl.NavigationControl(), "bottom-right");
map.addControl(new maplibregl.ScaleControl(), "bottom-left");

const loaded = [];   // { code, name, wells:[] }

function toFeatures(wells) {
  const pts = [], lines = [];
  for (const w of wells) {
    const horiz = ("bla" in w);
    pts.push({ type: "Feature",
      geometry: { type: "Point", coordinates: [w.lo, w.la] },
      properties: { wa: w.wa || "", n: w.n || "", td: w.td || 0, tvd: w.tvd || 0,
                    u: (w.u || []).join(" "), horiz: horiz ? 1 : 0, prov: w._p } });
    if (horiz)
      lines.push({ type: "Feature",
        geometry: { type: "LineString", coordinates: [[w.lo, w.la], [w.blo, w.bla]] },
        properties: {} });
  }
  return { pts: { type: "FeatureCollection", features: pts },
           lines: { type: "FeatureCollection", features: lines } };
}

function provEnabled(code) {
  const cb = document.getElementById("cb-" + code);
  return cb ? cb.checked : true;
}

function applyFilter() {
  const horizOnly = document.getElementById("horiz-only").checked;
  const tdMin = +document.getElementById("td-min").value;
  let total = 0, shown = 0;
  for (const p of loaded) {
    total += p.wells.length;
    if (!provEnabled(p.code)) {
      map.getSource("wells-" + p.code).setData({ type: "FeatureCollection", features: [] });
      map.getSource("lat-" + p.code).setData({ type: "FeatureCollection", features: [] });
      continue;
    }
    const filt = p.wells.filter(w => (!horizOnly || "bla" in w) && (w.td || 0) >= tdMin);
    shown += filt.length;
    const fc = toFeatures(filt);
    map.getSource("wells-" + p.code).setData(fc.pts);
    map.getSource("lat-" + p.code).setData(fc.lines);
  }
  document.getElementById("count").innerHTML =
    `<b>${shown.toLocaleString()}</b> of ${total.toLocaleString()} wells shown`;
}

function wireWellLayer(code) {
  map.on("click", "wells-" + code, e => {
    const p = e.features[0].properties;
    const uwis = (p.u || "").trim();
    const html = `<div class="pop"><h3>${p.n || "(unnamed well)"}</h3>
      <div class="row">${p.wa ? "Lic <b>" + p.wa + "</b>" : ""}${p.horiz ? " · <b>horizontal</b>" : ""} · ${p.prov.toUpperCase()}</div>
      ${(p.td || p.tvd) ? `<div class="row">${p.td ? "MD (actual) <b>" + (+p.td).toLocaleString() + " m</b>" : ""}${p.tvd ? " · TVD (vertical) <b>" + (+p.tvd).toLocaleString() + " m</b>" : ""}</div>` : ""}
      ${uwis ? `<div class="uwi">${uwis.split(" ").join("<br>")}</div>` : ""}
      <a class="btn" href="/?well=${encodeURIComponent(p.wa || (p.u||"").split(" ")[0] || "")}">Extract this well's charts →</a></div>`;
    new maplibregl.Popup({ closeButton: true }).setLngLat(e.lngLat).setHTML(html).addTo(map);
  });
  map.on("mouseenter", "wells-" + code, () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "wells-" + code, () => map.getCanvas().style.cursor = "");
}

map.on("load", async () => {
  const provDiv = document.getElementById("prov");
  const srcNames = [];
  const bounds = new maplibregl.LngLatBounds();
  for (const P of PROVINCES) {
    let data;
    try {
      const r = await fetch(P.file);
      if (!r.ok) continue;
      data = await r.json();
    } catch { continue; }
    const wells = data.wells.map(w => (w._p = P.code, w));
    loaded.push({ code: P.code, name: P.name, wells });
    if (data.source) srcNames.push(data.source);

    const fc = toFeatures(wells);
    map.addSource("lat-" + P.code, { type: "geojson", data: fc.lines });
    map.addSource("wells-" + P.code, { type: "geojson", data: fc.pts });
    map.addLayer({ id: "lat-" + P.code, type: "line", source: "lat-" + P.code,
      paint: { "line-color": "#3d7dff", "line-width": 1.4, "line-opacity": 0.75 } });
    map.addLayer({ id: "wells-" + P.code, type: "circle", source: "wells-" + P.code,
      paint: {
        "circle-radius": ["interpolate", ["linear"], ["zoom"], 5, 1.3, 9, 3, 13, 5],
        "circle-color": ["case", ["==", ["get", "horiz"], 1], "#3d7dff", "#3fb950"],
        "circle-opacity": 0.85,
        "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 9, 0, 12, 0.6],
        "circle-stroke-color": "#0f1621"
      } });
    wireWellLayer(P.code);

    // province toggle
    const lbl = document.createElement("label");
    lbl.innerHTML = `<input type="checkbox" id="cb-${P.code}" checked> ${P.name} <span class="stat">(${wells.length.toLocaleString()})</span>`;
    provDiv.appendChild(lbl);
    lbl.querySelector("input").addEventListener("change", applyFilter);

    for (const w of wells) bounds.extend([w.lo, w.la]);
  }

  document.getElementById("loading").style.display = "none";
  if (!loaded.length) {
    document.getElementById("count").textContent = "No well data available.";
    return;
  }
  document.getElementById("sources").textContent = "Source: " + [...new Set(srcNames)].join(" · ");
  document.getElementById("count").innerHTML =
    `<b>${loaded.reduce((s, p) => s + p.wells.length, 0).toLocaleString()}</b> wells`;
  if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 60, maxZoom: 8, duration: 0 });

  document.getElementById("horiz-only").addEventListener("change", applyFilter);
  const tdSlider = document.getElementById("td-min");
  tdSlider.addEventListener("input", () => {
    document.getElementById("td-val").textContent = (+tdSlider.value).toLocaleString() + " m";
    applyFilter();
  });

  // search across all provinces by UWI, name or WA
  const search = document.getElementById("search");
  search.addEventListener("keydown", ev => {
    if (ev.key !== "Enter") return;
    const q = search.value.trim().toLowerCase();
    if (!q) return;
    let hit = null;
    for (const p of loaded) {
      hit = p.wells.find(w =>
        (w.n || "").toLowerCase().includes(q) ||
        (w.u || []).some(u => u.toLowerCase().includes(q)) ||
        (w.wa || "").toLowerCase() === q);
      if (hit) break;
    }
    if (hit) {
      map.flyTo({ center: [hit.lo, hit.la], zoom: 12 });
      new maplibregl.Popup().setLngLat([hit.lo, hit.la])
        .setHTML(`<div class="pop"><h3>${hit.n || "(unnamed)"}</h3><div class="row">${hit.wa ? "WA <b>" + hit.wa + "</b>" : ""}${hit.td ? " · TD <b>" + hit.td + " m</b>" : ""}</div></div>`)
        .addTo(map);
    } else {
      search.style.borderColor = "#b03a2e";
      setTimeout(() => search.style.borderColor = "", 1000);
    }
  });
});
</script>
</body>
</html>
