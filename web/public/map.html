<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stratum — Pad map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --panel:#10161d; --ink:#e8eef4; --mut:#93a3b3; --line:#243040; --acc:#4d8dff;
          --mono:ui-monospace,Menlo,Consolas,monospace; }
  html, body { margin:0; height:100%; background:#0b1015; color:var(--ink);
               font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  #map { position:absolute; inset:0; }
  .side { position:absolute; top:12px; left:12px; bottom:12px; width:320px; max-width:calc(100% - 24px);
          background:rgba(16,22,29,.94); border:1px solid var(--line); border-radius:12px;
          display:flex; flex-direction:column; overflow:hidden; z-index:5; }
  .side header { padding:12px 14px 8px; border-bottom:1px solid var(--line); }
  .side h1 { margin:0; font-size:17px; letter-spacing:.01em; }
  .side .sub { color:var(--mut); font-family:var(--mono); font-size:12px; margin-top:2px; }
  .side .body { overflow:auto; padding:8px 8px 12px; }
  .pad { border:1px solid var(--line); border-radius:9px; margin:6px 0; overflow:hidden; }
  .pad > button { width:100%; text-align:left; background:#151d26; color:var(--ink); border:none; padding:9px 11px;
                  font:inherit; font-weight:600; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .pad > button .n { color:var(--mut); font-family:var(--mono); font-weight:400; font-size:12px; }
  .pad .sw { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:8px; vertical-align:-1px; }
  .pad ul { list-style:none; margin:0; padding:4px 0; display:none; }
  .pad.open ul { display:block; }
  .pad li { padding:0; }
  .pad li a { display:flex; justify-content:space-between; gap:8px; padding:6px 12px 6px 30px; color:var(--ink); text-decoration:none; }
  .pad li a:hover, .pad li a.on { background:#1c2632; }
  .pad li .m { color:var(--mut); font-family:var(--mono); font-size:11.5px; white-space:nowrap; }
  .pad li .m b { color:#9fd8a8; font-weight:600; }
  .side footer { padding:8px 14px; border-top:1px solid var(--line); color:var(--mut); font-size:12px; }
  .side footer a { color:var(--acc); }
  .maplibregl-popup-content { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px;
                              padding:12px 14px; font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif; min-width:220px; }
  .maplibregl-popup-tip { border-top-color:var(--panel) !important; border-bottom-color:var(--panel) !important; }
  .maplibregl-popup-close-button { color:var(--mut); font-size:18px; }
  .pop b { font-size:14px; }
  .pop .facts { color:var(--mut); font-family:var(--mono); font-size:12px; margin:6px 0 2px; }
  .pop a.btn { display:inline-block; margin-top:9px; background:var(--acc); color:#fff; text-decoration:none;
               padding:6px 11px; border-radius:7px; font-weight:600; }
  .legend { position:absolute; right:12px; top:12px; background:rgba(16,22,29,.9); border:1px solid var(--line);
            border-radius:10px; padding:8px 12px; font-size:12px; color:var(--mut); z-index:5; }
  .legend .row { display:flex; align-items:center; gap:8px; margin:3px 0; }
  .legend .l { width:22px; height:0; border-top:3px solid #4d8dff; }
  .legend .l.thin { border-top-width:1.5px; opacity:.7; }
  .legend .d { width:10px; height:10px; border-radius:50%; background:#fff; }
  .padlabel { font:600 12px/1 -apple-system,Segoe UI,Roboto,sans-serif; color:#e8eef4; text-shadow:0 0 3px #0b1015, 0 0 6px #0b1015; white-space:nowrap; pointer-events:none; }
  @media (max-width: 640px) { .side { width:auto; right:12px; bottom:auto; max-height:46%; } .legend { display:none; } }
</style>
</head>
<body>
<div id="map"></div>
<div class="side">
  <header>
    <h1>Stratum</h1>
    <div class="sub" id="sub">loading pads…</div>
  </header>
  <div class="body" id="pads"></div>
  <footer>Laterals are drawn from each well's directional survey. Click a lateral for the well; <a href="pad.html">pad views</a>.</footer>
</div>
<div class="legend">
  <div class="row"><span class="l"></span> lateral with frac stages loaded</div>
  <div class="row"><span class="l thin"></span> lateral, survey only</div>
  <div class="row"><span class="d"></span> pad (surface location)</div>
</div>

<script>
const PAD_COLORS = ["#4d8dff", "#ff8a4d", "#3ecf8e", "#e35d9a", "#f2c94c", "#8f6bff", "#4dd0e1", "#ff6b6b", "#9ccc65", "#ba68c8"];
const fmt = (v, d = 0) => v == null || isNaN(v) ? "–" : Number(v).toLocaleString(undefined, { maximumFractionDigits: d });

const map = new maplibregl.Map({
  container: "map",
  style: { version: 8,
    sources: {
      base: { type: "raster",
        tiles: ["https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"],
        tileSize: 256, maxzoom: 16, attribution: "Esri" },
      ref: { type: "raster",
        tiles: ["https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}"],
        tileSize: 256, maxzoom: 16 }
    },
    layers: [{ id: "base", type: "raster", source: "base" }, { id: "ref", type: "raster", source: "ref" }] },
  center: [-122.11, 56.80], zoom: 11
});
map.addControl(new maplibregl.NavigationControl(), "bottom-right");
map.addControl(new maplibregl.ScaleControl(), "bottom-left");
// resolved once the style has loaded — registered now, so the pads' fetch
// can finish before or after the map is ready without missing the event
const mapReady = new Promise(resolve => map.on("load", resolve));

const SETS = [];          // {set, name, pads:[{id, name, lat, lon, color, wells:[...]}]}
const WELL_BY_WA = {};

async function load() {
  let idx = { sets: [] };
  try { idx = await (await fetch("data/pads/index.json")).json(); } catch (e) {}
  for (const s of idx.sets || []) {
    try {
      const d = await (await fetch("data/pads/" + s.file)).json();
      d.pads.forEach((p, i) => { p.color = PAD_COLORS[i % PAD_COLORS.length]; p.set = s.set; for (const w of p.wells) { w.pad = p; WELL_BY_WA[w.wa] = w; } });
      SETS.push({ set: s.set, name: s.name || s.set, pads: d.pads });
    } catch (e) {}
  }
  render();
}

function features() {
  const lines = [], toes = [], pads = [];
  for (const S of SETS) for (const p of S.pads) {
    pads.push({ type: "Feature", geometry: { type: "Point", coordinates: [p.lon, p.lat] },
                properties: { id: p.id, name: p.name, wells: p.wells.length, color: p.color } });
    for (const w of p.wells) {
      if (!w.path || w.path.length < 2) continue;
      const props = { wa: w.wa, name: w.name, uwi: w.uwi || "", td: w.td, tvd: w.tvd, lateral: w.lateral,
                      stages: w.stages || 0, logs: w.logs || 0, stations: w.stations || 0, color: p.color, pad: p.name };
      lines.push({ type: "Feature", geometry: { type: "LineString", coordinates: w.path }, properties: props });
      toes.push({ type: "Feature", geometry: { type: "Point", coordinates: w.path[w.path.length - 1] }, properties: props });
    }
  }
  return { lines: fc(lines), toes: fc(toes), pads: fc(pads) };
}
const fc = f => ({ type: "FeatureCollection", features: f });

function render() {
  const f = features();
  const add = () => {
    map.addSource("laterals", { type: "geojson", data: f.lines });
    map.addSource("toes", { type: "geojson", data: f.toes });
    map.addSource("pads", { type: "geojson", data: f.pads });
    map.addLayer({ id: "laterals-halo", type: "line", source: "laterals",
      paint: { "line-color": "#000", "line-width": ["case", [">", ["get", "stages"], 0], 5, 3.5], "line-opacity": .35 },
      layout: { "line-cap": "round", "line-join": "round" } });
    map.addLayer({ id: "laterals", type: "line", source: "laterals",
      paint: { "line-color": ["get", "color"], "line-width": ["case", [">", ["get", "stages"], 0], 3, 1.6],
               "line-opacity": ["case", [">", ["get", "stages"], 0], 1, .75] },
      layout: { "line-cap": "round", "line-join": "round" } });
    map.addLayer({ id: "toes", type: "circle", source: "toes",
      paint: { "circle-radius": 3, "circle-color": ["get", "color"], "circle-stroke-color": "#0b1015", "circle-stroke-width": 1 } });
    map.addLayer({ id: "pads", type: "circle", source: "pads",
      paint: { "circle-radius": 7, "circle-color": "#ffffff", "circle-stroke-color": ["get", "color"], "circle-stroke-width": 3 } });
    // pad names as HTML markers: the raster base style carries no glyphs,
    // so a symbol layer cannot draw text here
    for (const pf of f.pads.features) {
      const el = document.createElement("div");
      el.className = "padlabel"; el.textContent = pf.properties.name; el.style.color = pf.properties.color;
      new maplibregl.Marker({ element: el, anchor: "top", offset: [0, 9] }).setLngLat(pf.geometry.coordinates).addTo(map);
    }
    const b = new maplibregl.LngLatBounds();
    for (const l of f.lines.features) for (const c of l.geometry.coordinates) b.extend(c);
    // leave room for the sidebar only when the map is wide enough to spare it
    const wide = map.getContainer().clientWidth > 760;
    if (!b.isEmpty()) map.fitBounds(b, { padding: { top: 60, bottom: 40, left: wide ? 360 : 24, right: wide ? 60 : 24 }, duration: 0, maxZoom: 13.5 });
    for (const id of ["laterals", "toes"]) {
      map.on("mouseenter", id, () => map.getCanvas().style.cursor = "pointer");
      map.on("mouseleave", id, () => map.getCanvas().style.cursor = "");
      map.on("click", id, e => openWell(e.features[0].properties, e.lngLat));
    }
    map.on("click", "pads", e => {
      const p = e.features[0].properties;
      const el = document.querySelector(`.pad[data-id="${p.id}"]`);
      if (el) { el.classList.add("open"); el.scrollIntoView({ block: "nearest" }); }
    });
  };
  mapReady.then(add);
  sidebar();
}

let popup = null;
function openWell(p, lngLat) {
  if (popup) popup.remove();
  const facts = [
    p.pad, p.td ? `TD ${fmt(p.td)} m` : null, p.tvd ? `TVD ${fmt(p.tvd)} m` : null,
    p.lateral ? `lateral ${fmt(p.lateral)} m` : null,
    p.stages ? `${p.stages} frac stages` : "no frac stages loaded yet",
    p.logs ? `${p.logs} log tracks` : null, p.stations ? `${p.stations} survey stations` : null,
  ].filter(Boolean);
  popup = new maplibregl.Popup({ closeButton: true, maxWidth: "320px" })
    .setLngLat(lngLat)
    .setHTML(`<div class="pop"><b>${p.name}</b><div class="facts">${p.uwi ? p.uwi + " · " : ""}WA ${p.wa}<br>${facts.join(" · ")}</div>
              <a class="btn" href="/well.html?wa=${encodeURIComponent(p.wa)}">Show Data →</a></div>`)
    .addTo(map);
  document.querySelectorAll(".pad li a.on").forEach(a => a.classList.remove("on"));
  const a = document.querySelector(`.pad li a[data-wa="${p.wa}"]`);
  if (a) { a.classList.add("on"); a.closest(".pad").classList.add("open"); }
}

function sidebar() {
  const el = document.getElementById("pads");
  const nWells = SETS.reduce((n, s) => n + s.pads.reduce((m, p) => m + p.wells.length, 0), 0);
  const nStaged = SETS.reduce((n, s) => n + s.pads.reduce((m, p) => m + p.wells.filter(w => w.stages).length, 0), 0);
  document.getElementById("sub").textContent = SETS.length
    ? `${SETS.map(s => s.name).join(", ")} · ${SETS.reduce((n, s) => n + s.pads.length, 0)} pads · ${nWells} wells · ${nStaged} with frac stages`
    : "no pads built yet";
  el.innerHTML = SETS.map(S => S.pads.map(p => `
    <div class="pad" data-id="${p.id}">
      <button type="button"><span><span class="sw" style="background:${p.color}"></span>${p.name}</span>
        <span class="n">${p.wells.length} wells · ${p.wells.filter(w => w.stages).length} staged</span></button>
      <ul>${p.wells.map(w => `<li><a href="#" data-wa="${w.wa}">${w.name.replace(/^TOURMALINE\s+HZ\s+/i, "")}
          <span class="m">${fmt(w.lateral)} m${w.stages ? ` · <b>${w.stages} stg</b>` : ""}${w.logs ? " · GR" : ""}</span></a></li>`).join("")}</ul>
    </div>`).join("")).join("");
  el.querySelectorAll(".pad > button").forEach(b => b.addEventListener("click", () => {
    const pad = b.parentElement; pad.classList.toggle("open");
    const p = SETS.flatMap(s => s.pads).find(x => x.id === pad.dataset.id);
    if (p) map.flyTo({ center: [p.lon, p.lat], zoom: Math.max(map.getZoom(), 12.5) });
  }));
  el.querySelectorAll(".pad li a").forEach(a => a.addEventListener("click", ev => {
    ev.preventDefault();
    const w = WELL_BY_WA[a.dataset.wa]; if (!w || !w.path) return;
    const mid = w.path[Math.floor(w.path.length / 2)];
    map.flyTo({ center: mid, zoom: Math.max(map.getZoom(), 13) });
    openWell({ wa: w.wa, name: w.name, uwi: w.uwi, td: w.td, tvd: w.tvd, lateral: w.lateral, stages: w.stages || 0,
               logs: w.logs || 0, stations: w.stations || 0, pad: w.pad.name }, mid);
  }));
}
load();
</script>
</body>
</html>
