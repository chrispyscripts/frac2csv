<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked log — Carmine's Lab</title>
<style>
  /* Same palette and type as the Lab and stacked.html. Light only. */
  :root {
    --bg:#fbfbfa; --panel:#ffffff; --panel2:#f3f4f6; --ink:#14181d; --mut:#697077;
    --line:#e3e5e8; --carmine:#a31631; --ok:#1e7a34;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; margin:0; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
         font:14px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif; }
  .top { display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap;
         padding:10px 16px; border-bottom:1px solid var(--line); background:var(--bg); }
  .top .meta { flex:1 1 280px; min-width:0; }
  .wordmark { font-size:13px; font-weight:700; letter-spacing:-0.01em; }
  .wordmark::after { content:"."; color:var(--carmine); }
  .title { font-size:14px; font-weight:600; margin-top:1px; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap; }
  .sub { font-size:11.5px; color:var(--mut); font-family:var(--mono); margin-top:2px;
         overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tools label { font-size:12px; color:var(--mut); display:flex; gap:6px; align-items:center; }
  #zoom { width:200px; }
  .scl { font-family:var(--mono); font-size:11.5px; color:var(--ink); min-width:62px; }
  .btn { border:1px solid var(--line); border-radius:6px; background:var(--panel);
         color:var(--ink); font:inherit; font-size:12px; font-weight:600;
         padding:3px 10px; cursor:pointer; text-decoration:none; }
  .btn:hover { border-color:var(--carmine); color:var(--carmine); }
  .btn.on { background:var(--carmine); border-color:var(--carmine); color:#fff; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { border:none; border-right:1px solid var(--line); background:var(--panel);
                color:var(--ink); font:inherit; font-size:12px; font-weight:600;
                padding:3px 10px; cursor:pointer; }
  .seg button:last-child { border-right:none; }
  .seg button:hover { color:var(--carmine); }
  .seg button.on { background:var(--carmine); color:#fff; }
  .note { font-size:12px; color:var(--mut); padding:6px 16px; border-bottom:1px solid var(--line); }
  .note b { color:var(--ink); font-weight:600; }
  /* The canvas lies over the scroller instead of inside it. Inside, it was
     part of what scrolls: at a Windows display scale (125%, 150%) it came out
     a fraction of a pixel wider than the window, that put up scrollbars, the
     scrollbars made the window narrower, the next draw made it fit again,
     the scrollbars went away -- on every mouse move, and the fitted log
     zoomed in and out with them. The spacer alone says how far to scroll,
     and only when the log really is bigger than the window. The vertical
     scrollbar keeps its room either way, so it never changes the width. */
  .view { flex:1 1 auto; position:relative; min-height:0; }
  .scroller { position:absolute; inset:0; overflow:auto; cursor:grab;
              scrollbar-gutter:stable; }
  .scroller.drag { cursor:grabbing; }
  .spacer { width:0; height:0; }
  canvas#cv { position:absolute; top:0; left:0; display:block; pointer-events:none; }
</style>
</head>
<body>
  <div class="top">
    <div class="meta">
      <div class="wordmark">Frac2CSV</div>
      <div class="title" id="title">Stacked log</div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="tools">
      <span class="seg" title="Each curve in a band of its own, or all of them on one chart">
        <button type="button" id="mSep">Separated data</button><button type="button" id="mComb">Combined</button>
      </span>
      <button class="btn on" id="fit" title="Stretch the whole log across the window (or double-click it)">Fit whole log</button>
      <label title="Ctrl or ⌘ and the mouse wheel zoom too">Zoom
        <input type="range" id="zoom" min="0" max="1000" step="1" value="0"></label>
      <span class="scl" id="scl"></span>
      <button class="btn" id="asprint" title="The scale LogViewer printed it at">1:240</button>
      <button class="btn on" id="clip" title="Scale each curve to the middle 99% of its values">Clip spikes</button>
      <button class="btn on" id="showprint" title="The LogViewer printout's curve chart under the LAS curves, on the same depth scale">Printout</button>
      <a class="btn" id="pdflink" target="_blank" hidden title="The printout's curve chart, stitched into one long page">Open stitched PDF</a>
    </div>
  </div>
  <div class="note" id="note" hidden></div>
  <div class="view">
    <div class="scroller" id="scroller"><div class="spacer" id="spacer"></div></div>
    <canvas id="cv"></canvas>
  </div>
<script src="wstiles.js"></script>
<script>
"use strict";
// Depth runs across, like the Lab's own chart: the curves in bands one above
// the other and the printout under them, every band on the same depth scale,
// so a feature in the LAS sits straight above the same feature on the print.
const $ = id => document.getElementById(id);
const CSS_PX_PER_M = n => 96 / 0.0254 / n;          // 1:n on a 96 dpi screen
const MAX_PX_PER_M = CSS_PX_PER_M(100);              // closest zoom, 1:100
const LABEL_W = 170, PAD_R = 16, RULER_H = 30, GAP = 8, LITH_H = 16, PAD_B = 10;
// At a fitted scale the printout at its own proportions is a sliver; it is
// stretched to at least this tall, and its label says so.
const PRINT_MIN_H = 220;
const MONO = "ui-monospace,Menlo,Consolas,monospace";
const SANS = "-apple-system,'Segoe UI',system-ui,sans-serif";
const COLORS = ["#1d5bd8", "#b02e2e", "#1e7a34", "#7a3b9b", "#b0731f", "#0f7d7d",
                "#5a5f6e", "#8a2f5e"];
const ROCK = { SS: "#f2d14b", SAND: "#f2d14b", SNDST: "#f2d14b", SH: "#8a9a7b",
  SHALE: "#8a9a7b", SHGY: "#8a9a7b", SLTST: "#c9a46b", SILT: "#c9a46b", LS: "#6fa8dc",
  LMST: "#6fa8dc", LIME: "#6fa8dc", DOL: "#b48ad8", DOLO: "#b48ad8", COAL: "#1b1b1b",
  ANHY: "#f4b6c2", SALT: "#e8eef4", CHT: "#b5651d", CHERT: "#b5651d", CGL: "#e39b5b",
  CONGL: "#e39b5b", MRST: "#9fb7a0", MDST: "#9fb7a0", CLYST: "#a8b39b", TILL: "#c7c0a8",
  BENT: "#d9c27a", GYP: "#f0c8d8" };
function rockColor(code) {
  const c = String(code || "").toUpperCase();
  if (ROCK[c]) return ROCK[c];
  let h = 0; for (const ch of c) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360} 45% 62%)`;
}
function fmt(v) {
  if (v == null || !isFinite(v)) return "–";
  const a = Math.abs(v);
  return a >= 1000 ? v.toFixed(0) : a >= 100 ? v.toFixed(1) : a >= 1 ? v.toFixed(2) : v.toPrecision(2);
}
function fitText(g, s, w) {
  s = String(s ?? "");
  if (g.measureText(s).width <= w) return s;
  while (s.length > 1 && g.measureText(s + "…").width > w) s = s.slice(0, -1);
  return s + "…";
}

let ID = new URLSearchParams(location.search).get("id") || "";
let REV = "";
let D = null, P = null;            // payload, printout info
let pxPerM = CSS_PX_PER_M(500);
let fit = true;                    // the whole log fills the window
let clip = true, showPrint = true;
let mode = "separate";             // "separate": a band per curve; "combined": one chart
try { if (localStorage.getItem("f2c.logstack.mode") === "combined") mode = "combined"; }
catch (e) { /* storage blocked: start separated */ }
let ranges = [], rows = [];
let hoverDepth = null;
const sc = $("scroller");

function curveRange(vals) {
  const v = vals.filter(x => x != null && isFinite(x)).sort((a, b) => a - b);
  if (!v.length) return [0, 1];
  let lo = v[0], hi = v[v.length - 1];
  if (clip && v.length > 20) {
    lo = v[Math.floor(v.length * 0.005)];
    hi = v[Math.ceil(v.length * 0.995) - 1];
  }
  if (hi <= lo) hi = lo + 1;
  return [lo, hi];
}

// ---- scale: fitted, or set by the slider (logarithmic, fit .. 1:100) ----
function plotW() { return Math.max(100, sc.clientWidth - LABEL_W - PAD_R); }
function fitPxPerM() { return Math.max(0.01, plotW() / Math.max(1, D.bottom - D.top)); }
function minPxPerM() { return Math.min(fitPxPerM(), MAX_PX_PER_M); }
function clampPx(px) { return Math.max(minPxPerM(), Math.min(MAX_PX_PER_M, px)); }
function sliderToPx(v) {
  const a = minPxPerM(), b = MAX_PX_PER_M;
  return a * Math.pow(b / a, v / 1000);
}
function pxToSlider(px) {
  const a = minPxPerM(), b = MAX_PX_PER_M;
  return b > a ? Math.round(1000 * Math.log(px / a) / Math.log(b / a)) : 0;
}
function midDepth() { return D.top + (sc.scrollLeft + plotW() / 2) / pxPerM; }
function setPx(px, keepDepth) {
  if (!D) return;
  const mid = keepDepth != null ? keepDepth : midDepth();
  pxPerM = clampPx(px);
  layout();
  sc.scrollLeft = (mid - D.top) * pxPerM - plotW() / 2;
  syncZoomUI();
}
function syncZoomUI() {
  if (D) {
    $("zoom").value = String(pxToSlider(pxPerM));
    $("scl").textContent = "1:" + Math.round(96 / 0.0254 / pxPerM).toLocaleString();
  }
  $("fit").classList.toggle("on", fit);
  $("mSep").classList.toggle("on", mode === "separate");
  $("mComb").classList.toggle("on", mode === "combined");
}

// ---- the bands, top to bottom ----
function printBand() {
  if (!P || !showPrint) return null;
  const own = Math.round(P.width_pt * pxPerM / P.pt_per_m);
  return own >= PRINT_MIN_H ? { h: own, stretched: false } : { h: PRINT_MIN_H, stretched: true };
}
function buildRows() {
  const vh = sc.clientHeight || 600;
  const pb = printBand(), lith = D.lithology.length > 0, n = D.curves.length;
  // the curves share what the printout leaves; it takes at most half the window
  const avail = vh - RULER_H - PAD_B - GAP - (lith ? LITH_H + GAP : 0)
    - (pb ? Math.min(pb.h, Math.round(vh * 0.5)) + GAP : 0);
  const out = [];
  let y = GAP;
  if (n && mode === "combined") {
    const h = Math.max(Math.max(160, 24 + n * 15), Math.min(440, avail));
    out.push({ kind: "combined", y, h }); y += h + GAP;
  } else if (n) {
    const h = Math.max(64, Math.min(170, Math.floor(avail / n) - GAP));
    D.curves.forEach((c, i) => { out.push({ kind: "curve", i, y, h }); y += h + GAP; });
  }
  if (lith) { out.push({ kind: "lith", y, h: LITH_H }); y += LITH_H + GAP; }
  if (pb) { out.push({ kind: "print", y, h: pb.h, stretched: pb.stretched }); y += pb.h + GAP; }
  return { rows: out, height: y };
}
function layout() {
  if (!D) return;
  ranges = D.curves.map(c => curveRange(c.values));
  const b = buildRows();
  rows = b.rows;
  const sp = $("spacer");
  // Only a log a whole pixel bigger than the window scrolls. At fit the log
  // is the window's width exactly, and a fraction over (the window's width is
  // fractional at a Windows display scale) put up scrollbars that shrank the
  // window the log had been fitted to.
  const cw = LABEL_W + (D.bottom - D.top) * pxPerM + PAD_R, ch = RULER_H + b.height + PAD_B;
  sp.style.width = (cw - sc.clientWidth >= 1 ? Math.floor(cw) : 0) + "px";
  sp.style.height = (ch - sc.clientHeight >= 1 ? Math.ceil(ch) : 0) + "px";
  draw();
}

function gridStep() {
  for (const s of [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000])
    if (s * pxPerM >= 64) return s;
  return 5000;
}

const printTiles = WsTiles(() => draw());

// ---- drawing: the canvas is the window; it draws what is scrolled into view ----
let raf = 0;
function draw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; drawNow(); }); }

function drawCurve(g, k, X, top, h, d0, d1, lw) {
  const c = D.curves[k], [lo, hi] = ranges[k];
  const i0 = Math.max(0, Math.floor((d0 - D.depth0) / D.step) - 1);
  const i1 = Math.min(D.rows - 1, Math.ceil((d1 - D.depth0) / D.step) + 1);
  g.strokeStyle = COLORS[k % COLORS.length]; g.lineWidth = lw; g.beginPath();
  let pen = false;
  for (let i = i0; i <= i1; i++) {
    const v = c.values[i];
    if (v == null) { pen = false; continue; }
    const x = X(D.depth0 + i * D.step);
    const y = top + 3 + (h - 6) * (1 - Math.max(0, Math.min(1, (v - lo) / (hi - lo))));
    if (pen) g.lineTo(x, y); else g.moveTo(x, y);
    pen = true;
  }
  g.stroke();
}
function valueAt(k) {
  if (hoverDepth == null) return null;
  const i = Math.round((hoverDepth - D.depth0) / D.step);
  return i >= 0 && i < D.rows ? D.curves[k].values[i] : null;
}

function drawNow() {
  if (!D) return;
  const cv = $("cv"), dpr = window.devicePixelRatio || 1;
  const vw = sc.clientWidth, vh = sc.clientHeight;
  if (cv.width !== Math.round(vw * dpr)) cv.width = Math.round(vw * dpr);
  if (cv.height !== Math.round(vh * dpr)) cv.height = Math.round(vh * dpr);
  cv.style.width = vw + "px"; cv.style.height = vh + "px";
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#fbfbfa"; g.fillRect(0, 0, vw, vh);
  const pw = vw - LABEL_W - PAD_R;
  const d0 = D.top + sc.scrollLeft / pxPerM, d1 = d0 + pw / pxPerM;
  const X = d => LABEL_W + (d - d0) * pxPerM;
  const step = gridStep();
  const firstTick = Math.ceil(d0 / step) * step;

  g.save(); g.beginPath(); g.rect(0, RULER_H, vw, vh - RULER_H); g.clip();
  for (const r of rows) {
    const top = RULER_H + r.y - sc.scrollTop;
    if (top + r.h < RULER_H || top > vh) continue;
    g.fillStyle = "#fff"; g.fillRect(LABEL_W, top, pw, r.h);
    g.save(); g.beginPath(); g.rect(LABEL_W, top, pw, r.h); g.clip();
    if (r.kind === "curve" || r.kind === "combined") {
      g.lineWidth = 1;
      for (let d = firstTick; d <= d1; d += step) {
        const x = Math.round(X(d)) + 0.5;
        g.strokeStyle = "#eceef1"; g.beginPath(); g.moveTo(x, top); g.lineTo(x, top + r.h); g.stroke();
      }
      for (let q = 1; q < 4; q++) {
        const y = Math.round(top + r.h * q / 4) + 0.5;
        g.strokeStyle = "#f1f2f4"; g.beginPath(); g.moveTo(LABEL_W, y); g.lineTo(LABEL_W + pw, y); g.stroke();
      }
      if (r.kind === "curve") drawCurve(g, r.i, X, top, r.h, d0, d1, 1.2);
      else D.curves.forEach((c, k) => drawCurve(g, k, X, top, r.h, d0, d1, 1.3));
    }
    if (r.kind === "lith") {
      for (const iv of D.lithology) {
        if (iv.base < d0 || iv.top > d1) continue;
        g.fillStyle = rockColor(iv.code);
        g.fillRect(X(iv.top), top + 2, Math.max(1, (iv.base - iv.top) * pxPerM), r.h - 4);
      }
    }
    if (r.kind === "print") {
      printTiles.draw(g, { id: ID, P, d0, d1, X, top, h: r.h, pxPerM, dpr,
                           w: r.stretched ? Math.round(r.h * dpr) : 0 });
    }
    g.restore();
    g.strokeStyle = "#d2d6db"; g.lineWidth = 1;
    g.strokeRect(LABEL_W + 0.5, top + 0.5, pw - 1, r.h - 1);
    drawLabel(g, r, top);
  }
  if (hoverDepth != null && hoverDepth >= d0 && hoverDepth <= d1) {
    const x = Math.round(X(hoverDepth)) + 0.5;
    g.strokeStyle = "rgba(163,22,49,.8)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, RULER_H); g.lineTo(x, vh); g.stroke();
  }
  g.restore();

  // the depth ruler, always at the top
  g.fillStyle = "#fbfbfa"; g.fillRect(0, 0, vw, RULER_H);
  g.strokeStyle = "#d2d6db"; g.beginPath(); g.moveTo(0, RULER_H - 0.5); g.lineTo(vw, RULER_H - 0.5); g.stroke();
  g.fillStyle = "#697077"; g.font = `11px ${SANS}`; g.textAlign = "left"; g.textBaseline = "middle";
  g.fillText(`Depth, m ${D.axis || ""}`, 12, RULER_H / 2);
  g.save(); g.beginPath(); g.rect(LABEL_W - 30, 0, pw + 60, RULER_H); g.clip();
  g.font = `11px ${MONO}`; g.textAlign = "center"; g.fillStyle = "#3a4048";
  for (let d = firstTick; d <= d1 + 1e-9; d += step) {
    const x = Math.round(X(d)) + 0.5;
    g.strokeStyle = "#9aa1a9"; g.beginPath(); g.moveTo(x, RULER_H - 6); g.lineTo(x, RULER_H); g.stroke();
    g.fillText(String(+d.toFixed(1)), x, RULER_H / 2 - 1);
  }
  if (hoverDepth != null && hoverDepth >= d0 && hoverDepth <= d1) {
    const s = hoverDepth.toFixed(2), x = X(hoverDepth), w = g.measureText(s).width + 10;
    g.fillStyle = "#a31631"; g.fillRect(x - w / 2, 4, w, RULER_H - 9);
    g.fillStyle = "#fff"; g.fillText(s, x, RULER_H / 2 - 1);
  }
  g.restore();
}

function drawLabel(g, r, top) {
  const L = 12, Rx = LABEL_W - 8;
  g.textBaseline = "middle";
  if (r.kind === "curve") {
    const c = D.curves[r.i], [lo, hi] = ranges[r.i], col = COLORS[r.i % COLORS.length];
    g.fillStyle = col; g.fillRect(L, top + 11, 12, 3);
    g.fillStyle = "#14181d"; g.font = `600 12px ${SANS}`; g.textAlign = "left";
    g.fillText(fitText(g, c.name, LABEL_W - L - 60), L + 17, top + 13);
    g.fillStyle = "#697077"; g.font = `11px ${SANS}`;
    g.fillText(fitText(g, c.unit || "", LABEL_W - L - 60), L, top + 30);
    g.font = `10.5px ${MONO}`; g.textAlign = "right";
    g.fillText(fmt(hi), Rx, top + 10);
    g.fillText(fmt(lo), Rx, top + r.h - 9);
    if (hoverDepth != null && r.h >= 52) {
      g.fillStyle = col; g.font = `600 12px ${MONO}`; g.textAlign = "left";
      g.fillText(fmt(valueAt(r.i)), L, top + 48);
    }
  }
  if (r.kind === "combined") {
    D.curves.forEach((c, k) => {
      const y = top + 12 + k * 15;
      if (y > top + r.h - 6) return;
      const col = COLORS[k % COLORS.length];
      g.fillStyle = col; g.fillRect(L, y - 1, 12, 3);
      g.fillStyle = "#14181d"; g.font = `600 11.5px ${SANS}`; g.textAlign = "left";
      g.fillText(fitText(g, c.name + (c.unit ? " " + c.unit : ""), LABEL_W - L - 70), L + 17, y);
      if (hoverDepth != null) {
        g.fillStyle = col; g.font = `600 11px ${MONO}`; g.textAlign = "right";
        g.fillText(fmt(valueAt(k)), Rx, y);
      }
    });
  }
  if (r.kind === "lith") {
    g.fillStyle = "#697077"; g.font = `11px ${SANS}`; g.textAlign = "left";
    g.fillText("Lith", L, top + r.h / 2);
    const iv = hoverDepth == null ? null
      : D.lithology.find(v => hoverDepth >= v.top && hoverDepth < v.base);
    if (iv) { g.fillStyle = "#14181d"; g.textAlign = "right"; g.font = `600 11px ${MONO}`; g.fillText(iv.code, Rx, top + r.h / 2); }
  }
  if (r.kind === "print") {
    g.textAlign = "left";
    g.fillStyle = "#14181d"; g.font = `600 12px ${SANS}`;
    g.fillText(P.part === "curves" ? "Printed curves" : "Printout", L, top + 13);
    g.fillStyle = "#697077"; g.font = `11px ${SANS}`;
    g.fillText(P.part === "curves" ? "LogViewer curve chart" : "LogViewer, stitched", L, top + 30);
    g.fillText(`${P.log_pages} pages`, L, top + 45);
    g.fillText(r.stretched ? "stretched to fit" : "as printed", L, top + 60);
  }
}

// ---- which log: the one the Lab has selected ----
async function load(id) {
  if (!id) { $("title").textContent = "No log given"; return; }
  let out;
  try {
    const r = await fetch("/api/wellsight-view?id=" + encodeURIComponent(id));
    out = await r.json();
    if (!r.ok) throw new Error(out.error || r.status);
  } catch (e) {
    $("title").textContent = "This log is not loaded";
    $("sub").textContent = String(e.message || e) + " — drop the file on the Lab again.";
    return;
  }
  const was = D ? midDepth() : null;
  const sameLog = id === ID && D;
  ID = id; D = out.payload; P = out.printout;
  try { history.replaceState(null, "", "?id=" + encodeURIComponent(ID)); } catch (e) { /* file: */ }
  document.title = (D.well || D.file) + " — stacked log";
  $("title").textContent = D.well || D.file;
  $("sub").textContent = [D.file, `${D.app} ${D.version}`, `${D.top}–${D.bottom} m ${D.axis}`,
                          D.scale, D.licence && "licence " + D.licence].filter(Boolean).join(" · ");
  const note = $("note");
  note.hidden = false;
  const keys = " ← → move along the log; ↑ ↓ step through the logs in the Lab.";
  if (!P) {
    note.innerHTML = "No printout yet. In the Lab, <b>Printouts folder…</b> names the folder that holds "
      + "them, or <b>Add printout PDF</b> (LogViewer: File &gt; Print, Microsoft Print to PDF, All, "
      + "Page Breaks off)." + keys;
    $("showprint").hidden = true; $("pdflink").hidden = true;
  } else {
    const c = P.check || {};
    note.innerHTML = `Printout: <b>${P.log_pages}</b> of ${P.pages} pages placed by their depth labels`
      + (c.labels ? `; ${c.labels} labels, median ${c.median_m} m from their depth` : "")
      + (P.gaps && P.gaps.length ? `; <b>gaps</b> at ${P.gaps.map(g => g.join("–")).join(", ")} m` : "")
      + ". LogViewer draws a curve half a recorded step shallower than the depth the LAS gives it."
      + keys;
    $("showprint").hidden = false;
    const a = $("pdflink"); a.hidden = false;
    a.href = "/api/wellsight-strip.pdf?id=" + encodeURIComponent(ID);
  }
  sc.scrollTop = 0;
  if (fit) setPx(fitPxPerM(), (D.top + D.bottom) / 2);
  else setPx(pxPerM, sameLog && was != null ? was : D.top + plotW() / 2 / pxPerM);
}

// ---- controls ----
function setMode(m) {
  mode = m;
  try { localStorage.setItem("f2c.logstack.mode", m); } catch (e) { /* not kept */ }
  sc.scrollTop = 0;
  layout(); syncZoomUI();
}
$("mSep").addEventListener("click", () => setMode("separate"));
$("mComb").addEventListener("click", () => setMode("combined"));
function fitAll() {
  fit = true;
  if (D) setPx(fitPxPerM(), (D.top + D.bottom) / 2);
  syncZoomUI();
}
$("fit").addEventListener("click", () => {
  if (fit) { fit = false; syncZoomUI(); return; }
  fitAll();
});
$("zoom").addEventListener("input", () => {
  if (!D) return;
  fit = false;
  setPx(sliderToPx(Number($("zoom").value)));
});
$("asprint").addEventListener("click", () => {
  if (!D) return;
  fit = false;
  const n = parseInt(String(D.scale || "").replace(/^.*1:(\d+).*$/, "$1"), 10) || 240;
  setPx(CSS_PX_PER_M(n));
});
$("clip").addEventListener("click", () => { clip = !clip; $("clip").classList.toggle("on", clip); layout(); });
$("showprint").addEventListener("click", () => { showPrint = !showPrint; $("showprint").classList.toggle("on", showPrint); layout(); });

// ---- mouse: hover reads, drag moves, Ctrl/⌘ + wheel zooms, double-click fits ----
function depthAtX(clientX) {
  const x = clientX - sc.getBoundingClientRect().left;
  if (x < LABEL_W || x > sc.clientWidth - PAD_R) return null;
  return D.top + (sc.scrollLeft + x - LABEL_W) / pxPerM;
}
let drag = null;
sc.addEventListener("mousedown", e => {
  if (e.button !== 0 || !D) return;
  drag = { x: e.clientX, y: e.clientY, sl: sc.scrollLeft, st: sc.scrollTop };
  sc.classList.add("drag");
  e.preventDefault();
});
window.addEventListener("mousemove", e => {
  if (!D) return;
  if (drag) {
    sc.scrollLeft = drag.sl - (e.clientX - drag.x);
    sc.scrollTop = drag.st - (e.clientY - drag.y);
  }
  const r = sc.getBoundingClientRect();
  const inside = e.clientY >= r.top && e.clientY <= r.bottom;
  const d = inside ? depthAtX(e.clientX) : null;
  if (d !== hoverDepth) { hoverDepth = d; draw(); }
});
window.addEventListener("mouseup", () => { drag = null; sc.classList.remove("drag"); });
sc.addEventListener("mouseleave", () => { if (!drag) { hoverDepth = null; draw(); } });
sc.addEventListener("dblclick", () => fitAll());
sc.addEventListener("scroll", draw);
sc.addEventListener("wheel", e => {
  if (!D) return;
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    const x = e.clientX - sc.getBoundingClientRect().left;
    const at = D.top + (sc.scrollLeft + x - LABEL_W) / pxPerM;
    fit = false;
    pxPerM = clampPx(pxPerM * Math.pow(1.0015, -e.deltaY));
    layout();
    sc.scrollLeft = (at - D.top) * pxPerM - (x - LABEL_W);
    syncZoomUI();
    return;
  }
  // nothing to scroll up and down: the wheel moves along the log
  if (sc.scrollHeight <= sc.clientHeight + 1 && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    e.preventDefault();
    sc.scrollLeft += e.deltaY;
  }
}, { passive: false });
let resizeT = 0;
new ResizeObserver(() => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (!D) return;
    if (fit) setPx(fitPxPerM(), (D.top + D.bottom) / 2);
    else { const mid = midDepth(); pxPerM = clampPx(pxPerM); setPx(pxPerM, mid); }
  }, 60);
}).observe(sc);

// ---- the Lab: it says which log to show; the arrow keys ask it for the next ----
function lab() {
  try { return window.opener && !window.opener.closed ? window.opener : null; }
  catch (e) { return null; }
}
window.addEventListener("message", ev => {
  if (ev.origin !== location.origin) return;
  const d = ev.data || {};
  if (d.type === "logstack:show" && d.id && (d.id !== ID || (d.rev || "") !== REV || !D)) {
    REV = d.rev || "";
    load(d.id);
  }
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== "range") return;
  if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && D) {
    e.preventDefault();
    sc.scrollLeft += (e.key === "ArrowRight" ? 1 : -1) * plotW() * 0.25;
    return;
  }
  if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  const o = lab();
  if (!o) return;
  e.preventDefault();
  o.postMessage({ type: "logstack:nav", dir: e.key === "ArrowDown" ? 1 : -1 }, location.origin);
});
syncZoomUI();
load(ID).then(() => {
  const o = lab();
  if (o) o.postMessage({ type: "logstack:ready" }, location.origin);
});
</script>
</body>
</html>
