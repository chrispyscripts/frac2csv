<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked log — Carmine's Lab</title>
<style>
  /* Same palette and type as the Lab and stacked.html. Light only. */
  :root {
    --bg:#fbfbfa; --panel:#ffffff; --panel2:#f3f4f6; --ink:#14181d; --mut:#697077;
    --line:#e3e5e8; --carmine:#a31631; --ok:#1e7a34;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; margin:0; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
         font:14px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif; }
  .top { display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap;
         padding:10px 16px; border-bottom:1px solid var(--line); background:var(--bg); }
  .top .meta { flex:1 1 280px; min-width:0; }
  .wordmark { font-size:13px; font-weight:700; letter-spacing:-0.01em; }
  .wordmark::after { content:"."; color:var(--carmine); }
  .title { font-size:14px; font-weight:600; margin-top:1px; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap; }
  .sub { font-size:11.5px; color:var(--mut); font-family:var(--mono); margin-top:2px;
         overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tools label { font-size:12px; color:var(--mut); display:flex; gap:6px; align-items:center; }
  #zoom { width:200px; }
  .scl { font-family:var(--mono); font-size:11.5px; color:var(--ink); min-width:62px; }
  .btn { border:1px solid var(--line); border-radius:6px; background:var(--panel);
         color:var(--ink); font:inherit; font-size:12px; font-weight:600;
         padding:3px 10px; cursor:pointer; text-decoration:none; }
  .btn:hover { border-color:var(--carmine); color:var(--carmine); }
  .btn.on { background:var(--carmine); border-color:var(--carmine); color:#fff; }
  .note { font-size:12px; color:var(--mut); padding:6px 16px; border-bottom:1px solid var(--line); }
  .note b { color:var(--ink); font-weight:600; }
  .heads { display:flex; padding:0 16px; border-bottom:1px solid var(--line);
           background:var(--panel); overflow:hidden; flex-shrink:0; }
  .head { flex-shrink:0; padding:5px 6px 4px; border-right:1px solid var(--line);
          font-size:11.5px; line-height:1.35; overflow:hidden; }
  .head .nm { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .head .nm i { display:inline-block; width:12px; height:3px; border-radius:2px;
                vertical-align:middle; margin-right:5px; }
  .head .rg { color:var(--mut); font-family:var(--mono); font-size:10.5px; white-space:nowrap;
              display:flex; justify-content:space-between; gap:6px; }
  .head .ro { font-family:var(--mono); font-size:11px; min-height:15px; white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; }
  .scroller { flex:1 1 auto; overflow:auto; position:relative; padding:0 16px; }
  .spacer { position:relative; }
  canvas#cv { position:sticky; top:0; display:block; }
</style>
</head>
<body>
  <div class="top">
    <div class="meta">
      <div class="wordmark">Frac2CSV</div>
      <div class="title" id="title">Stacked log</div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="tools">
      <button class="btn on" id="fit" title="Stretch the whole log to fit the window">Fit whole log</button>
      <label title="Ctrl or ⌘ and the mouse wheel zoom too">Zoom
        <input type="range" id="zoom" min="0" max="1000" step="1" value="0"></label>
      <span class="scl" id="scl"></span>
      <button class="btn" id="asprint" title="The scale LogViewer printed it at">1:240</button>
      <button class="btn on" id="clip" title="Scale each curve to the middle 99% of its values">Clip spikes</button>
      <button class="btn on" id="showprint" title="The stitched LogViewer printout, on the same depth scale">Printout</button>
      <a class="btn" id="pdflink" target="_blank" hidden>Open stitched PDF</a>
    </div>
  </div>
  <div class="note" id="note" hidden></div>
  <div class="heads" id="heads"></div>
  <div class="scroller" id="scroller">
    <div class="spacer" id="spacer"><canvas id="cv"></canvas></div>
  </div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const CSS_PX_PER_M = n => 96 / 0.0254 / n;          // 1:n on a 96 dpi screen
const MAX_PX_PER_M = CSS_PX_PER_M(100);              // closest zoom, 1:100
const TRACK_W = 150, DEPTH_W = 54, LITH_W = 46;
// At a fitted scale the printout at its own proportions is a sliver; it is
// stretched across to at least this, and its header says so.
const PRINT_MIN_W = 300;
const COLORS = ["#1d5bd8", "#b02e2e", "#1e7a34", "#7a3b9b", "#b0731f", "#0f7d7d",
                "#5a5f6e", "#8a2f5e"];
const ROCK = { SS: "#f2d14b", SAND: "#f2d14b", SNDST: "#f2d14b", SH: "#8a9a7b",
  SHALE: "#8a9a7b", SHGY: "#8a9a7b", SLTST: "#c9a46b", SILT: "#c9a46b", LS: "#6fa8dc",
  LMST: "#6fa8dc", LIME: "#6fa8dc", DOL: "#b48ad8", DOLO: "#b48ad8", COAL: "#1b1b1b",
  ANHY: "#f4b6c2", SALT: "#e8eef4", CHT: "#b5651d", CHERT: "#b5651d", CGL: "#e39b5b",
  CONGL: "#e39b5b", MRST: "#9fb7a0", MDST: "#9fb7a0", CLYST: "#a8b39b", TILL: "#c7c0a8",
  BENT: "#d9c27a", GYP: "#f0c8d8" };
function rockColor(code) {
  const c = String(code || "").toUpperCase();
  if (ROCK[c]) return ROCK[c];
  let h = 0; for (const ch of c) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360} 45% 62%)`;
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmt(v) {
  if (v == null || !isFinite(v)) return "–";
  const a = Math.abs(v);
  return a >= 1000 ? v.toFixed(0) : a >= 100 ? v.toFixed(1) : a >= 1 ? v.toFixed(2) : v.toPrecision(2);
}

let ID = new URLSearchParams(location.search).get("id") || "";
let REV = "";
let D = null, P = null;            // payload, printout info
let pxPerM = CSS_PX_PER_M(500);
let fit = true;                    // the whole log fills the window
let clip = true, showPrint = true;
let ranges = [];
let hoverDepth = null;
const tiles = new Map();

function curveRange(vals) {
  const v = vals.filter(x => x != null && isFinite(x)).sort((a, b) => a - b);
  if (!v.length) return [0, 1];
  let lo = v[0], hi = v[v.length - 1];
  if (clip && v.length > 20) {
    lo = v[Math.floor(v.length * 0.005)];
    hi = v[Math.ceil(v.length * 0.995) - 1];
  }
  if (hi <= lo) hi = lo + 1;
  return [lo, hi];
}

// ---- scale: fitted, or set by the slider (logarithmic, fit .. 1:100) ----
function fitPxPerM() {
  const h = $("scroller").clientHeight || 600;
  return Math.max(0.02, h / Math.max(1, D.bottom - D.top));
}
function minPxPerM() { return Math.min(fitPxPerM(), MAX_PX_PER_M); }
function sliderToPx(v) {
  const a = minPxPerM(), b = MAX_PX_PER_M;
  return a * Math.pow(b / a, v / 1000);
}
function pxToSlider(px) {
  const a = minPxPerM(), b = MAX_PX_PER_M;
  return b > a ? Math.round(1000 * Math.log(px / a) / Math.log(b / a)) : 0;
}
function setPx(px, keepDepth) {
  const sc = $("scroller");
  const mid = keepDepth != null ? keepDepth
    : (D ? D.top + (sc.scrollTop + sc.clientHeight / 2) / pxPerM : 0);
  pxPerM = Math.max(minPxPerM(), Math.min(MAX_PX_PER_M, px));
  layout();
  if (D) sc.scrollTop = (mid - D.top) * pxPerM - sc.clientHeight / 2;
  syncZoomUI();
}
function syncZoomUI() {
  $("zoom").value = String(pxToSlider(pxPerM));
  $("scl").textContent = "1:" + Math.round(96 / 0.0254 / pxPerM).toLocaleString();
  $("fit").classList.toggle("on", fit);
}

function printWidth() {
  if (!P || !showPrint) return { w: 0, stretched: false };
  const own = Math.round(P.width_pt * pxPerM / P.pt_per_m);
  return own >= PRINT_MIN_W ? { w: own, stretched: false } : { w: PRINT_MIN_W, stretched: true };
}
function trackX() {
  const xs = [];
  let x = 0;
  xs.push({ kind: "depth", x, w: DEPTH_W }); x += DEPTH_W;
  D.curves.forEach((c, i) => { xs.push({ kind: "curve", i, x, w: TRACK_W }); x += TRACK_W; });
  if (D.lithology.length) { xs.push({ kind: "lith", x, w: LITH_W }); x += LITH_W; }
  const pw = printWidth();
  if (pw.w) { xs.push({ kind: "print", x, w: pw.w, stretched: pw.stretched }); x += pw.w; }
  return { xs, width: x };
}

function layout() {
  if (!D) return;
  ranges = D.curves.map(c => curveRange(c.values));
  const { xs, width } = trackX();
  const total = (D.bottom - D.top) * pxPerM;
  const sc = $("scroller");
  $("spacer").style.height = Math.ceil(Math.max(total, sc.clientHeight)) + "px";
  $("spacer").style.width = width + "px";
  const heads = $("heads");
  heads.innerHTML = "";
  for (const t of xs) {
    const h = document.createElement("div");
    h.className = "head"; h.style.width = t.w + "px";
    if (t.kind === "depth") h.innerHTML = `<div class="nm">Depth</div><div class="rg">m ${esc(D.axis || "")}</div><div class="ro" id="ro-depth"></div>`;
    if (t.kind === "curve") {
      const c = D.curves[t.i], r = ranges[t.i];
      h.innerHTML = `<div class="nm" title="${esc(c.name)} — track ${esc(c.track || "-")}, recorded every ${c.recorded_step} m"><i style="background:${COLORS[t.i % COLORS.length]}"></i>${esc(c.name)} <span style="color:var(--mut);font-weight:400">${esc(c.unit)}</span></div>`
        + `<div class="rg"><span>${fmt(r[0])}</span><span>${fmt(r[1])}</span></div><div class="ro" id="ro-${t.i}"></div>`;
    }
    if (t.kind === "lith") h.innerHTML = `<div class="nm">Lith</div><div class="rg">&nbsp;</div><div class="ro" id="ro-lith"></div>`;
    if (t.kind === "print") h.innerHTML = `<div class="nm">Printout (LogViewer, stitched)</div>`
      + `<div class="rg">${P.log_pages} pages${t.stretched ? " · stretched across to fit" : " · as printed"}</div><div class="ro"></div>`;
    heads.appendChild(h);
  }
  sc.onscroll = () => { heads.scrollLeft = sc.scrollLeft; draw(); };
  draw();
}

function gridStep() {
  for (const s of [1, 2, 5, 10, 20, 50, 100, 200, 500])
    if (s * pxPerM >= 14) return s;
  return 1000;
}

function tileFor(a, b, ppmDev, wDev) {
  const key = `${ID}:${ppmDev.toFixed(4)}:${wDev}:${a}`;
  let t = tiles.get(key);
  if (!t) {
    t = { img: new Image(), ok: false };
    t.img.onload = () => { t.ok = true; draw(); };
    t.img.src = `/api/wellsight-strip?id=${encodeURIComponent(ID)}&d0=${a}&d1=${b}`
      + `&ppm=${ppmDev.toFixed(4)}` + (wDev ? `&w=${wDev}` : "");
    tiles.set(key, t);
    if (tiles.size > 200) tiles.delete(tiles.keys().next().value);
  }
  return t;
}

let raf = 0;
function draw() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; drawNow(); }); }
function drawNow() {
  if (!D) return;
  const sc = $("scroller"), cv = $("cv");
  const dpr = window.devicePixelRatio || 1;
  const { xs, width } = trackX();
  const h = sc.clientHeight;
  cv.width = Math.round(width * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = width + "px"; cv.style.height = h + "px";
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#fff"; g.fillRect(0, 0, width, h);
  const d0 = D.top + sc.scrollTop / pxPerM, d1 = d0 + h / pxPerM;
  const y = d => (d - d0) * pxPerM;
  const step = gridStep();
  const pr = xs.find(t => t.kind === "print");
  g.lineWidth = 1;
  for (let d = Math.ceil(d0 / step) * step; d <= d1; d += step) {
    const yy = Math.round(y(d)) + 0.5;
    g.strokeStyle = d % (step * 5) === 0 ? "#d2d6db" : "#eceef1";
    g.beginPath(); g.moveTo(DEPTH_W, yy); g.lineTo(pr ? pr.x : width, yy); g.stroke();
  }
  for (const t of xs) {
    if (t.kind === "depth") {
      g.fillStyle = "#3a4048"; g.font = "11px ui-monospace,Menlo,Consolas,monospace";
      g.textAlign = "right"; g.textBaseline = "middle";
      const ls = step * (step * pxPerM < 30 ? 5 : 1);
      for (let d = Math.ceil(d0 / ls) * ls; d <= d1; d += ls) g.fillText(String(+d.toFixed(2)), t.x + t.w - 6, y(d));
    }
    if (t.kind === "curve") {
      const c = D.curves[t.i], [lo, hi] = ranges[t.i];
      const i0 = Math.max(0, Math.floor((d0 - D.depth0) / D.step) - 1);
      const i1 = Math.min(D.rows - 1, Math.ceil((d1 - D.depth0) / D.step) + 1);
      g.save(); g.beginPath(); g.rect(t.x, 0, t.w, h); g.clip();
      g.strokeStyle = COLORS[t.i % COLORS.length]; g.lineWidth = 1.2; g.beginPath();
      let pen = false;
      for (let i = i0; i <= i1; i++) {
        const v = c.values[i];
        if (v == null) { pen = false; continue; }
        const xx = t.x + 2 + (t.w - 4) * Math.max(0, Math.min(1, (v - lo) / (hi - lo)));
        const yy = y(D.depth0 + i * D.step);
        if (pen) g.lineTo(xx, yy); else g.moveTo(xx, yy);
        pen = true;
      }
      g.stroke(); g.restore();
    }
    if (t.kind === "lith") {
      for (const iv of D.lithology) {
        if (iv.base < d0 || iv.top > d1) continue;
        g.fillStyle = rockColor(iv.code);
        g.fillRect(t.x + 3, y(iv.top), t.w - 6, Math.max(1, (iv.base - iv.top) * pxPerM));
      }
    }
    if (t.kind === "print") {
      const ppmDev = pxPerM * dpr;
      const wDev = t.stretched ? Math.round(t.w * dpr) : 0;
      const T = Math.max(1, Math.round(900 / pxPerM));      // metres per tile
      const first = Math.floor((d0 - P.top) / T) * T + P.top;
      for (let a = first; a < Math.min(d1, P.bottom); a += T) {
        const b = Math.min(a + T, P.bottom);
        const tl = tileFor(+a.toFixed(3), +b.toFixed(3), ppmDev, wDev);
        if (tl.ok) g.drawImage(tl.img, t.x, y(a), t.w, (b - a) * pxPerM);
        else { g.fillStyle = "#f6f7f8"; g.fillRect(t.x, y(a), t.w, (b - a) * pxPerM); }
      }
    }
    g.strokeStyle = "#e3e5e8"; g.beginPath(); g.moveTo(t.x + t.w - 0.5, 0); g.lineTo(t.x + t.w - 0.5, h); g.stroke();
  }
  if (hoverDepth != null && hoverDepth >= d0 && hoverDepth <= d1) {
    g.strokeStyle = "rgba(163,22,49,.75)"; g.lineWidth = 1;
    const yy = Math.round(y(hoverDepth)) + 0.5;
    g.beginPath(); g.moveTo(0, yy); g.lineTo(width, yy); g.stroke();
  }
}

function readout() {
  const set = (id, s) => { const el = $(id); if (el) el.textContent = s; };
  if (!D) return;
  if (hoverDepth == null) {
    set("ro-depth", ""); D.curves.forEach((c, i) => set("ro-" + i, "")); set("ro-lith", "");
    return;
  }
  set("ro-depth", hoverDepth.toFixed(2));
  const i = Math.round((hoverDepth - D.depth0) / D.step);
  D.curves.forEach((c, k) => set("ro-" + k, i >= 0 && i < D.rows ? fmt(c.values[i]) : "–"));
  const iv = D.lithology.find(v => hoverDepth >= v.top && hoverDepth < v.base);
  set("ro-lith", iv ? iv.code : "");
}

// ---- which log: the one the Lab has selected ----
async function load(id) {
  if (!id) { $("title").textContent = "No log given"; return; }
  let out;
  try {
    const r = await fetch("/api/wellsight-view?id=" + encodeURIComponent(id));
    out = await r.json();
    if (!r.ok) throw new Error(out.error || r.status);
  } catch (e) {
    $("title").textContent = "This log is not loaded";
    $("sub").textContent = String(e.message || e) + " — drop the file on the Lab again.";
    return;
  }
  const sc = $("scroller");
  const was = D ? D.top + (sc.scrollTop + sc.clientHeight / 2) / pxPerM : null;
  const sameLog = id === ID && D;
  ID = id; D = out.payload; P = out.printout;
  try { history.replaceState(null, "", "?id=" + encodeURIComponent(ID)); } catch (e) { /* file: */ }
  document.title = (D.well || D.file) + " — stacked log";
  $("title").textContent = D.well || D.file;
  $("sub").textContent = [D.file, `${D.app} ${D.version}`, `${D.top}–${D.bottom} m ${D.axis}`,
                          D.scale, D.licence && "licence " + D.licence].filter(Boolean).join(" · ");
  const note = $("note");
  note.hidden = false;
  if (!P) {
    note.innerHTML = "No printout yet. In the Lab, <b>Print with LogViewer</b> (Windows), or "
      + "<b>Add printout PDF</b>: File &gt; Print, Microsoft Print to PDF, All, Page Breaks off.";
    $("showprint").hidden = true; $("pdflink").hidden = true;
  } else {
    const c = P.check || {};
    note.innerHTML = `Printout: <b>${P.log_pages}</b> of ${P.pages} pages placed by their depth labels`
      + (c.labels ? `; ${c.labels} labels, median ${c.median_m} m from their depth` : "")
      + (P.gaps && P.gaps.length ? `; <b>gaps</b> at ${P.gaps.map(g => g.join("–")).join(", ")} m` : "")
      + ". LogViewer draws a curve half a recorded step shallower than the depth the LAS gives it."
      + " ↑ ↓ step through the logs in the Lab.";
    $("showprint").hidden = false;
    const a = $("pdflink"); a.hidden = false;
    a.href = "/api/wellsight-strip.pdf?id=" + encodeURIComponent(ID);
  }
  if (fit) setPx(fitPxPerM(), (D.top + D.bottom) / 2);
  else setPx(pxPerM, sameLog && was != null ? was : D.top + sc.clientHeight / 2 / pxPerM);
  if (!sameLog && !fit) sc.scrollTop = 0;
}

// ---- controls ----
$("fit").addEventListener("click", () => {
  fit = !fit;
  if (fit && D) setPx(fitPxPerM(), (D.top + D.bottom) / 2);
  syncZoomUI();
});
$("zoom").addEventListener("input", () => {
  if (!D) return;
  fit = false;
  setPx(sliderToPx(Number($("zoom").value)));
});
$("asprint").addEventListener("click", () => {
  if (!D) return;
  fit = false;
  const n = parseInt(String(D.scale || "").replace(/^.*1:(\d+).*$/, "$1"), 10) || 240;
  setPx(CSS_PX_PER_M(n));
});
$("clip").addEventListener("click", () => { clip = !clip; $("clip").classList.toggle("on", clip); layout(); });
$("showprint").addEventListener("click", () => { showPrint = !showPrint; $("showprint").classList.toggle("on", showPrint); layout(); });
$("scroller").addEventListener("mousemove", e => {
  if (!D) return;
  const r = $("cv").getBoundingClientRect();
  hoverDepth = D.top + ($("scroller").scrollTop + (e.clientY - r.top)) / pxPerM;
  draw(); readout();
});
$("scroller").addEventListener("mouseleave", () => { hoverDepth = null; draw(); readout(); });
$("scroller").addEventListener("wheel", e => {
  if (!D || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  const r = $("cv").getBoundingClientRect();
  const at = D.top + ($("scroller").scrollTop + (e.clientY - r.top)) / pxPerM;
  fit = false;
  const k = Math.pow(1.0015, -e.deltaY);
  const sc = $("scroller"), offset = e.clientY - r.top;
  pxPerM = Math.max(minPxPerM(), Math.min(MAX_PX_PER_M, pxPerM * k));
  layout();
  sc.scrollTop = (at - D.top) * pxPerM - offset;
  syncZoomUI();
}, { passive: false });
let resizeT = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    if (!D) return;
    if (fit) setPx(fitPxPerM(), (D.top + D.bottom) / 2);
    else { pxPerM = Math.max(minPxPerM(), pxPerM); layout(); syncZoomUI(); }
  }, 80);
});

// ---- the Lab: it says which log to show; the arrow keys ask it for the next ----
function lab() {
  try { return window.opener && !window.opener.closed ? window.opener : null; }
  catch (e) { return null; }
}
window.addEventListener("message", ev => {
  if (ev.origin !== location.origin) return;
  const d = ev.data || {};
  if (d.type === "logstack:show" && d.id && (d.id !== ID || (d.rev || "") !== REV || !D)) {
    REV = d.rev || "";
    load(d.id);
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const o = lab();
  if (!o) return;
  e.preventDefault();
  o.postMessage({ type: "logstack:nav", dir: e.key === "ArrowDown" ? 1 : -1 }, location.origin);
});
load(ID).then(() => {
  const o = lab();
  if (o) o.postMessage({ type: "logstack:ready" }, location.origin);
});
</script>
</body>
</html>
