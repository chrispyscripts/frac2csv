<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log header — Carmine's Lab</title>
<style>
  /* Same palette and type as the Lab and the stacked window. Light only. */
  :root {
    --bg:#fbfbfa; --panel:#ffffff; --panel2:#f3f4f6; --ink:#14181d; --mut:#697077;
    --line:#e3e5e8; --carmine:#a31631; --ok:#1e7a34;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; margin:0; }
  [hidden] { display:none !important; }
  body { background:var(--bg); color:var(--ink);
         font:14px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif; }
  .top { position:sticky; top:0; z-index:2; display:flex; align-items:flex-start; gap:16px;
         padding:10px 16px; border-bottom:1px solid var(--line); background:var(--bg); }
  .top .meta { flex:1 1 auto; min-width:0; }
  .wordmark { font-size:13px; font-weight:700; letter-spacing:-0.01em; }
  .wordmark::after { content:"."; color:var(--carmine); }
  .title { font-size:14px; font-weight:600; margin-top:1px; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap; }
  .sub { font-size:11.5px; color:var(--mut); font-family:var(--mono); margin-top:2px;
         overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tools { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .hint { font-size:11.5px; color:var(--mut); }
  .btn { border:1px solid var(--line); border-radius:6px; background:var(--panel);
         color:var(--ink); font:inherit; font-size:12px; font-weight:600;
         padding:3px 10px; cursor:pointer; }
  .btn:hover { border-color:var(--carmine); color:var(--carmine); }
  main { padding:14px 16px 40px; max-width:1100px; }
  h2 { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
       color:var(--mut); margin:18px 0 8px; }
  h2:first-child { margin-top:0; }
  .msg { color:var(--mut); padding:24px 0; }
  table.fields { border-collapse:collapse; width:100%; background:var(--panel);
                 border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  table.fields td { padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.fields tr:last-child td { border-bottom:none; }
  table.fields td.k { width:220px; color:var(--mut); font-size:12.5px; white-space:nowrap; }
  table.fields td.v { white-space:pre-wrap; overflow-wrap:anywhere; }
  .boxes { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:10px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .box h3 { font-size:12px; font-weight:700; letter-spacing:0.03em; margin-bottom:4px; }
  .box .row { font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .box .row b { color:var(--mut); font-weight:500; margin-right:6px; }
  pre.custom { background:var(--panel); border:1px solid var(--line); border-radius:8px;
               padding:10px 12px; font:12.5px/1.45 var(--mono); white-space:pre-wrap;
               overflow-wrap:anywhere; }
  figure { margin:0 0 14px; }
  figure img { display:block; width:100%; height:auto; background:#fff;
               border:1px solid var(--line); border-radius:6px; }
  figcaption { font-size:12px; color:var(--mut); margin-top:4px; }
  .note { font-size:12px; color:var(--mut); margin-bottom:8px; }
</style>
</head>
<body>
  <div class="top">
    <div class="meta">
      <div class="wordmark">Frac2CSV</div>
      <div class="title" id="title">Log header</div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="tools">
      <span class="hint">↑ ↓ next log</span>
      <button type="button" class="btn" id="copy" title="Copy the header's fields as text">Copy</button>
    </div>
  </div>
  <main id="main"><p class="msg">Waiting for the Lab…</p></main>

<script>
"use strict";
// The Lab says which log to show (logheader:show, on every log it shows);
// the arrow keys here ask it for the next one, so both windows always show
// the same log.
const $ = id => document.getElementById(id);
let ID = new URLSearchParams(location.search).get("id") || "";
let REV = "", H = null, seq = 0;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function say(text) {
  const m = $("main");
  m.replaceChildren(el("p", "msg", text));
}

async function load(id) {
  ID = id || "";
  H = null;
  if (!ID) {
    $("title").textContent = "Log header";
    $("sub").textContent = "";
    say("Select a WellSight log in the Lab to see its header here.");
    return;
  }
  const my = ++seq;
  let d;
  try {
    const r = await fetch("/api/wellsight-header?id=" + encodeURIComponent(ID), { cache: "no-store" });
    d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
  } catch (e) {
    if (my === seq) say("Could not read the header: " + e.message);
    return;
  }
  if (my !== seq) return;            // a newer log was asked for meanwhile
  H = d;
  render(d);
}

function fieldsTable(rows) {
  const t = el("table", "fields");
  for (const f of rows) {
    const tr = el("tr");
    tr.append(el("td", "k", f.label), el("td", "v", f.value));
    t.append(tr);
  }
  return t;
}

function render(d) {
  document.title = (d.well || d.file) + " — header";
  $("title").textContent = d.well || d.file;
  $("sub").textContent = [d.file, d.source === "template" ? "header page" :
                          d.source ? d.source : "", d.printout && "printout " + d.printout]
                         .filter(Boolean).join(" · ");
  const m = $("main");
  m.replaceChildren();
  const w = Math.round(Math.min(2000, (m.clientWidth || 900) * (window.devicePixelRatio || 1)));
  let any = false;
  if (d.fields.length) {
    m.append(el("h2", null, "Header"), fieldsTable(d.fields));
    any = true;
  }
  if (d.boxes.length) {
    m.append(el("h2", null, "Boxes"));
    const g = el("div", "boxes");
    for (const b of d.boxes) {
      const c = el("div", "box");
      c.append(el("h3", null, b.title || "Box"));
      for (const r of b.rows) {
        const row = el("div", "row");
        if (r.label) row.append(el("b", null, r.label));
        row.append(document.createTextNode(r.value));
        c.append(row);
      }
      g.append(c);
    }
    m.append(g);
    any = true;
  }
  if (d.custom && d.custom.length) {
    m.append(el("h2", null, "Header page (as typed in the log)"), el("pre", "custom", d.custom.join("\n")));
    any = true;
  }
  if (d.pages.length) {
    m.append(el("h2", null, "As printed"));
    for (const n of d.pages) {
      const f = el("figure");
      const img = el("img");
      img.loading = "lazy";
      img.alt = "Printout page " + n;
      img.src = "/api/wellsight-header-page?id=" + encodeURIComponent(d.id) + "&page=" + n + "&w=" + w;
      f.append(img, el("figcaption", null, (n === d.pages[0] ? "Printout page " : "Page ") + n));
      m.append(f);
    }
    any = true;
  } else if (!d.printout) {
    m.append(el("h2", null, "As printed"),
             el("p", "note", d.lookup ? "No printout for this log: " + d.lookup + "."
                                      : "No printout for this log yet; add one in the Lab to see its header page here."));
  }
  if (d.pictures) {
    m.append(el("h2", null, "Pictures stored in the log"),
             el("p", "note", "The log has no typed header; these are the pictures it holds. The header page is " +
                "one of them, and the store often also holds other wells' headers reused as templates, " +
                "so check the well name and licence on each."));
    for (let n = 1; n <= d.pictures; n++) {
      const f = el("figure");
      const img = el("img");
      img.loading = "lazy";
      img.alt = "Picture " + n;
      img.src = "/api/wellsight-header-picture?id=" + encodeURIComponent(d.id) + "&n=" + n;
      f.append(img, el("figcaption", null, "Picture " + n));
      m.append(f);
    }
    any = true;
  }
  if (!any) say("This log stores no header.");
  window.scrollTo(0, 0);
}

$("copy").addEventListener("click", async () => {
  if (!H) return;
  const lines = [H.well || H.file, ""].concat(H.fields.map(f => f.label + ": " + f.value));
  for (const b of H.boxes) {
    lines.push("", b.title);
    for (const r of b.rows) lines.push((r.label ? r.label + ": " : "") + r.value);
  }
  if (H.custom && H.custom.length) lines.push("", ...H.custom);
  try {
    await navigator.clipboard.writeText(lines.join("\n"));
    $("copy").textContent = "Copied";
  } catch (e) { $("copy").textContent = "Copy failed"; }
  setTimeout(() => { $("copy").textContent = "Copy"; }, 1500);
});

function lab() {
  try { return window.opener && !window.opener.closed ? window.opener : null; }
  catch (e) { return null; }
}
window.addEventListener("message", ev => {
  if (ev.origin !== location.origin) return;
  const d = ev.data || {};
  if (d.type !== "logheader:show") return;
  const id = d.id || "";
  if (id !== ID || (d.rev || "") !== REV || (id && !H)) {
    REV = d.rev || "";
    load(id);
  }
});
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
  const o = lab();
  if (!o) return;
  e.preventDefault();
  o.postMessage({ type: "logheader:nav", dir: e.key === "ArrowDown" ? 1 : -1 }, location.origin);
});
load(ID).then(() => {
  const o = lab();
  if (o) o.postMessage({ type: "logheader:ready" }, location.origin);
});
</script>
</body>
</html>
