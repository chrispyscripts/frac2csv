name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pymupdf numpy pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --name Frac2CSV
          --collect-all pymupdf
          frac2csv_gui.py

      - name: Smoke test import
        run: python -c "import frac_core; print('core ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: Frac2CSV-windows
          path: dist/Frac2CSV.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Frac2CSV.exe
          generate_release_notes: true
