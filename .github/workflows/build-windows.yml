name: build-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pymupdf numpy pillow pyinstaller

      - name: Install tesseract (bundled for auto-calibrate mode)
        run: choco install tesseract -y --no-progress

      - name: Build exe (web UI served locally)
        run: >
          pyinstaller --onefile --console --name Frac2CSV
          --collect-all pymupdf
          --add-data "C:\Program Files\Tesseract-OCR;tesseract"
          --add-data "alias_table.txt;."
          --add-data "lab\public;lab\public"
          localapp.py

      - name: Build legacy Tk exe
        run: >
          pyinstaller --onefile --windowed --name Frac2CSV-classic
          --collect-all pymupdf
          --add-data "C:\Program Files\Tesseract-OCR;tesseract"
          --add-data "alias_table.txt;."
          frac2csv_gui.py

      - name: Smoke test imports
        run: python -c "import pipeline, pipeline_export, aliases, localapp; print('pipeline ok; canonical', aliases.CANONICAL)"

      - uses: actions/upload-artifact@v4
        with:
          name: Frac2CSV-windows
          path: dist/Frac2CSV.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Frac2CSV.exe
          generate_release_notes: true
