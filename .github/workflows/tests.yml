name: tests

# Runs on every push and PR, not just on a release tag. The EXE build is
# tag-only, so until now nothing at all checked a commit before it shipped.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only what the pure tests import. They deliberately touch no PDFs, so
      # the suite stays fast and needs neither tesseract nor the corpus.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pymupdf

      - name: Run tests
        run: python -m unittest discover -s tests -v
