name: tests

# Runs on every push and PR, not just on a release tag. The EXE build is
# tag-only, so until now nothing at all checked a commit before it shipped.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only what the pure tests import. They deliberately touch no PDFs, so
      # the suite stays fast and needs neither tesseract nor the corpus.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pymupdf

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # The Lab is JavaScript, and the rules that decide whether a stage is
      # dated, where it sits on the FracView axis and whether its clock runs
      # backwards all live in it. Those tests lift the functions straight out
      # of the HTML, so they need node and nothing else — and until now
      # nothing ran them but a human.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Lab tests
        run: |
          fail=0
          for f in tests/*.js; do
            echo "--- $f"
            node "$f" || fail=1
          done
          exit $fail
